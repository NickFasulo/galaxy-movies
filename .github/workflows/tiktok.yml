name: tiktok

# Daily render of the streaming-diff video (scripts/generate-tiktok-video.js).
# Can't live on the worker crons — no ffmpeg in workerd — and reads the public
# /api/streaming-changes feed via --api, so TMDB_API_KEY is the only secret.
# Targets the workers.dev host: the custom domain's WAF managed-challenges
# datacenter IPs (403s from GH runners — same reason e2e avoids it).
on:
  schedule:
    - cron: '0 14 * * *' # 14:00 UTC — diff lands ~06:30 UTC; video ready by US morning
  workflow_dispatch:
    inputs:
      provider:
        description: Provider key (netflix, hulu, disney-plus, ...)
        default: netflix
      kind:
        type: choice
        options: [added, left, coming]
        default: added
      count:
        description: Titles per video
        default: '5'

concurrency:
  group: tiktok
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      # Optional PAT (repo scope) — lets tiktok-upload.js write the rotated
      # refresh token back to the TIKTOK_REFRESH_TOKEN secret.
      TIKTOK_GH_TOKEN: ${{ secrets.TIKTOK_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # matches ci.yml
          cache: npm
      - run: npm ci
      - run: >-
          node scripts/generate-tiktok-video.js
          --api https://galaxy-movies.winter-rice-c91a.workers.dev
          --provider ${{ inputs.provider || 'netflix' }}
          --kind ${{ inputs.kind || 'added' }}
          --count ${{ inputs.count || '5' }}
      - id: stamp
        run: echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: tiktok-${{ steps.stamp.outputs.date }}-${{ inputs.provider || 'netflix' }}-${{ inputs.kind || 'added' }}
          path: shots/tiktok/
          retention-days: 30
          if-no-files-found: error
      # Draft-upload is opt-in: skipped until the TIKTOK_* secrets exist.
      - if: env.TIKTOK_REFRESH_TOKEN != ''
        run: node scripts/tiktok-upload.js shots/tiktok/*.mp4
