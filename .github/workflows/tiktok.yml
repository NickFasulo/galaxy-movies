name: tiktok

# Daily render of the streaming-diff video (scripts/generate-tiktok-video.js).
# Can't live on the worker crons — no ffmpeg in workerd — and reads the public
# /api/streaming-changes feed via --api, so TMDB_API_KEY is the only secret.
# Targets the workers.dev host: the custom domain's WAF managed-challenges
# datacenter IPs (403s from GH runners — same reason e2e avoids it).
on:
  schedule:
    - cron: '0 14 * * *' # 14:00 UTC — diff lands ~06:30 UTC; video ready by US morning
  workflow_dispatch:
    inputs:
      provider:
        description: Provider key (netflix, hulu, disney-plus, ...)
        default: netflix
      kind:
        type: choice
        options: [added, left, coming, leaving, departures, pricedrops, engage]
        default: added
      count:
        description: Titles per video
        default: '5'

concurrency:
  group: tiktok
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      # Optional PAT (repo scope) — lets tiktok-upload.js write the rotated
      # refresh token back to the TIKTOK_REFRESH_TOKEN secret.
      TIKTOK_GH_TOKEN: ${{ secrets.TIKTOK_GH_TOKEN }}
      # Optional override for the requested privacy level — script defaults to
      # PUBLIC_TO_EVERYONE and degrades to SELF_ONLY while the app is unaudited.
      TIKTOK_PRIVACY: ${{ secrets.TIKTOK_PRIVACY }}
      # 'draft' (or unset) sends the video to the TikTok inbox for manual
      # finishing — used while the app awaits review. 'post' Direct-Posts.
      TIKTOK_POST_MODE: ${{ secrets.TIKTOK_POST_MODE }}
      # Email delivery of the MP4 + caption for manual posting.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      TIKTOK_EMAIL_TO: ${{ secrets.TIKTOK_EMAIL_TO }}
      # YouTube private upload (scripts/youtube-upload.js) — client creds are
      # the same GOOGLE_OAUTH_* pair the workspace MCP uses. YT_CHANNEL_ID
      # guards the target channel — the run aborts if the token resolves
      # elsewhere (e.g. a token minted while the personal channel was picked).
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
      # 'public' once the project passes YouTube's API audit; unset = private.
      YT_PRIVACY: ${{ secrets.YT_PRIVACY }}
      YT_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      # IG Reels publish (scripts/ig-upload.js) — posts PUBLIC immediately;
      # the Graph API has no draft mode. Blob is the public staging hop IG
      # requires for video_url.
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      UPSTASH_BLOB_TOKEN: ${{ secrets.UPSTASH_BLOB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # matches ci.yml
          cache: npm
      - run: npm ci
      # Scheduled runs rotate the week's content; workflow_dispatch inputs
      # always win for manual renders. The 25th's departures cut aligns with
      # the monthly digest that goes out to Reddit + socials the same day.
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "provider=${{ inputs.provider || 'netflix' }}" >> "$GITHUB_OUTPUT"
            echo "kind=${{ inputs.kind || 'added' }}" >> "$GITHUB_OUTPUT"
          else
            case "$(date -u +%u)" in
              1) echo "provider=netflix"     >> "$GITHUB_OUTPUT"; echo "kind=added"      >> "$GITHUB_OUTPUT" ;;
              2) echo "provider=hulu"        >> "$GITHUB_OUTPUT"; echo "kind=added"      >> "$GITHUB_OUTPUT" ;;
              3) echo "provider=netflix"     >> "$GITHUB_OUTPUT"; echo "kind=pricedrops" >> "$GITHUB_OUTPUT" ;;
              4) echo "provider=netflix"     >> "$GITHUB_OUTPUT"; echo "kind=engage"     >> "$GITHUB_OUTPUT" ;;
              5) echo "provider=netflix"     >> "$GITHUB_OUTPUT"; echo "kind=leaving"    >> "$GITHUB_OUTPUT" ;;
              6) echo "provider=disney-plus" >> "$GITHUB_OUTPUT"; echo "kind=coming"     >> "$GITHUB_OUTPUT" ;;
              7) echo "provider=max"         >> "$GITHUB_OUTPUT"; echo "kind=coming"     >> "$GITHUB_OUTPUT" ;;
            esac
            if [ "$(date -u +%-d)" = "25" ]; then echo "kind=departures" >> "$GITHUB_OUTPUT"; fi
          fi
      # Scheduled runs degrade through kinds that almost always have content
      # (a week with no price drops or an empty coming list exits 2, not an
      # error — engage needs no feed data at all, so it's the last resort).
      # Manual dispatches stay strict: an empty kind should report, not swap.
      - env:
          API: https://galaxy-movies.winter-rice-c91a.workers.dev
          PROVIDER: ${{ steps.pick.outputs.provider }}
          KIND: ${{ steps.pick.outputs.kind }}
          COUNT: ${{ inputs.count || '5' }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          attempts=("$PROVIDER:$KIND")
          # The provider's weekly adds are an on-theme fallback — except for
          # netflix/hulu, whose added videos already ran Mon/Tue; re-rendering
          # them midweek posts a near-duplicate. Those cases skip to
          # departures (monthly-gone titles, fresh theme) then engage.
          if [ "$KIND" != "added" ] && [ "$PROVIDER" != netflix ] && [ "$PROVIDER" != hulu ]; then
            attempts+=("$PROVIDER:added")
          fi
          if [ "$KIND" != "departures" ]; then attempts+=("netflix:departures"); fi
          attempts+=("netflix:engage")
          rc=0
          for a in "${attempts[@]}"; do
            rc=0
            node scripts/generate-tiktok-video.js --api "$API" --provider "${a%%:*}" --kind "${a##*:}" --count "$COUNT" || rc=$?
            if [ "$rc" -eq 0 ]; then exit 0; fi
            if [ "$SCHEDULED" != "true" ] || [ "$rc" -ne 2 ]; then exit "$rc"; fi
            echo "::warning::no items for ${a%%:*}/${a##*:} — trying next fallback"
          done
          exit "$rc"
      - id: stamp
        run: echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: tiktok-${{ steps.stamp.outputs.date }}-${{ steps.pick.outputs.provider }}-${{ steps.pick.outputs.kind }}
          path: shots/tiktok/
          retention-days: 30
          if-no-files-found: error
      # Email the MP4 + caption for manual posting — works regardless of the
      # TikTok app review state, skipped until the RESEND_* secrets exist.
      - if: env.RESEND_API_KEY != '' && env.TIKTOK_EMAIL_TO != ''
        run: node scripts/tiktok-send.js shots/tiktok/*.mp4
      # Auto-post is opt-in: skipped until the TIKTOK_* secrets exist. Mode
      # draft lands the video in the TikTok inbox for manual finishing (no
      # audit needed); mode post Direct-Posts — private-only until the app
      # passes review (creator_info flips it public automatically once approved).
      - if: env.TIKTOK_REFRESH_TOKEN != ''
        run: |
          MODE=""
          if [ "$TIKTOK_POST_MODE" = "post" ]; then MODE="--post"; fi
          node scripts/tiktok-upload.js $MODE shots/tiktok/*.mp4
      # Cross-posts: YouTube lands private (publish from Studio — same manual
      # finish as the TikTok draft); IG publishes the Reel immediately since
      # the Graph API has no draft mode.
      - if: env.YT_REFRESH_TOKEN != ''
        run: node scripts/youtube-upload.js shots/tiktok/*.mp4
      - if: env.IG_ACCESS_TOKEN != '' && env.IG_USER_ID != '' && env.UPSTASH_BLOB_TOKEN != ''
        run: node scripts/ig-upload.js shots/tiktok/*.mp4
