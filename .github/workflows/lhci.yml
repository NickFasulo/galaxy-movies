name: lhci

# Weekly Lighthouse regression check against lighthouserc.cjs budgets
# (perf 0.75, a11y/best-practices/seo 0.9, CLS 0.1). Reports upload to
# temporary-public-storage — link is in the job log.
on:
  schedule:
    - cron: '0 14 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lhci:
    runs-on: ubuntu-latest
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lhci
